name: Update Sponsors

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

concurrency:
  group: update-sponsors
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update sponsor blocks
        env:
          SPONSOR_LOGIN: NWYLZW
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN || github.token }}
        run: node scripts/update-sponsors.mjs

      - name: Commit sponsor changes
        run: |
          if git diff --quiet -- README.md README.zh-Hans.md README.ja.md; then
            echo "No sponsor changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-Hans.md README.ja.md
          git commit -m "Update sponsor board"
          git push
